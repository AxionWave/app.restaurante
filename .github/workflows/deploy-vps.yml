name: Deploy VPS

on:
  push:
    branches:
      - production
  workflow_dispatch:

concurrency:
  group: deploy-vps-app-restaurante
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Build
        run: npm run build
        env:
          VITE_GATEWAY_AMBIENTE: homolog
          VITE_ORION_AMBIENTE: homolog
          VITE_OAUTH_AMBIENTE: homolog
          VITE_BASE_PATH: /orion/
          VITE_APP_NOME_EMPRESA: Enterprise X
          VITE_APP_NOME_APP: Orion
          VITE_APP_SIGLA_SISTEMA: ORI
          VITE_APP_SECRET_TOKEN_QR: ${{ secrets.FRONTEND_SECRET_TOKEN }}

      - name: Upload dist
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          passphrase: ${{ secrets.VPS_SSH_PASSPHRASE }}
          port: ${{ secrets.VPS_PORT }}
          source: "dist/*"
          target: /tmp/orion-dist
          strip_components: 1
          rm: true

      - name: Publish on nginx
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          passphrase: ${{ secrets.VPS_SSH_PASSPHRASE }}
          port: ${{ secrets.VPS_PORT }}
          script: |
            set -e
            mkdir -p /var/www/enterprise-apps/orion
            rm -rf /var/www/enterprise-apps/orion/*
            cp -a /tmp/orion-dist/. /var/www/enterprise-apps/orion/
            chown -R www-data:www-data /var/www/enterprise-apps/orion
            mkdir -p /etc/nginx/snippets/enterprise-apps
            printf '%s\n' \
              'location = /orion { return 301 /orion/; }' \
              'location ^~ /orion/ {' \
              '    root /var/www/enterprise-apps;' \
              '    index index.html;' \
              '    try_files $uri $uri/ /orion/index.html;' \
              '}' > /etc/nginx/snippets/enterprise-apps/orion.conf
            CONF=/etc/nginx/sites-available/enterprise.lumenemotion.com.br
            if ! grep -q 'snippets/enterprise-apps/' "$CONF"; then
              echo "Falta 'include snippets/enterprise-apps/*.conf;' no bloco 443 de $CONF"
              exit 1
            fi
            nginx -t
            systemctl reload nginx
            code=$(curl -s -o /dev/null -w '%{http_code}' -k -H 'Host: enterprise.lumenemotion.com.br' https://127.0.0.1/orion/)
            echo "GET /orion/ -> $code"
            [ "$code" = "200" ]
