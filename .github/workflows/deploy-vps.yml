name: Deploy VPS

on:
  push:
    branches:
      - production
  workflow_dispatch:

concurrency:
  group: deploy-vps-app-restaurante
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Build
        run: npm run build
        env:
          VITE_GATEWAY_AMBIENTE: homolog
          VITE_ORION_AMBIENTE: homolog
          VITE_OAUTH_AMBIENTE: homolog
          VITE_BASE_PATH: /
          VITE_APP_NOME_EMPRESA: Axion Wave
          VITE_APP_NOME_APP: Orion
          VITE_APP_SIGLA_SISTEMA: ORI
          VITE_APP_SECRET_TOKEN_QR: ${{ secrets.FRONTEND_SECRET_TOKEN }}

      - name: Upload dist
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          passphrase: ${{ secrets.VPS_SSH_PASSPHRASE }}
          port: ${{ secrets.VPS_PORT }}
          source: "dist/*"
          target: /tmp/orion-dist
          strip_components: 1
          rm: true

      - name: Publish on nginx
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          passphrase: ${{ secrets.VPS_SSH_PASSPHRASE }}
          port: ${{ secrets.VPS_PORT }}
          script: |
            set -e
            mkdir -p /var/www/enterprise-apps/orion
            rm -rf /var/www/enterprise-apps/orion/*
            cp -a /tmp/orion-dist/. /var/www/enterprise-apps/orion/
            chown -R www-data:www-data /var/www/enterprise-apps/orion
            if [ ! -f /etc/nginx/sites-enabled/orion.lumensoft.com.br ]; then
              echo "Falta o site nginx orion.lumensoft.com.br (server block + certificado) na VPS"
              exit 1
            fi
            code=000
            for i in 1 2 3 4 5 6; do
              sleep 2
              code=$(curl -s -o /dev/null -w '%{http_code}' --resolve orion.lumensoft.com.br:443:127.0.0.1 https://orion.lumensoft.com.br/)
              if [ "$code" = "200" ]; then break; fi
            done
            echo "GET https://orion.lumensoft.com.br/ -> $code"
            [ "$code" = "200" ]
